name: Yaskawa Robots CI Pipeline

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches:
      - '**'
  release:
    types: [published]
  schedule:
    - cron: '0 10 * * *'  # 10 AM UTC daily (6 AM EDT / 5 AM EST)
    - cron: '0 10 * * 0'  # 10 AM UTC every Sunday (weekly unconditional run)

jobs:
  check-recent-commits:
    name: Check for Recent Commits
    runs-on: ubuntu-latest
    outputs:
      has_recent_commits: ${{ steps.check.outputs.has-new-commits || steps.tag-fallback.outputs.has-new-commits }}
    steps:
      - name: Check if building from tag
        id: tag-fallback
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Building from tag, skipping recent commits check"
          echo "has-new-commits=false" >> $GITHUB_OUTPUT

      - name: Check for commits in last 24 hours
        id: check
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: adriangl/check-new-commits-action@6556947ca20c2047ed733894258186619b84d282
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          seconds: 86400

  build-test-lint:
    name: Build, Test, and Lint
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/viam-modules/yaskawa-robots:${{ matrix.arch }}@${{ matrix.digest }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
          digest: sha256:be64d6ac165c02353eb1675641ef68cbcebe2d136ffc5e12ca24a1d034894964
        - arch: arm64
          runner: ubuntu-4cpu-arm
          digest: sha256:0ba1ab8e4957f2be2110cc9766c7595839cfb244baee2549b9428047bd682c9d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Configure
        run: make configure
      - name: Format
        run: make format-check
      - name: Check Check
        run: make run-clang-check
      - name: Check Tidy
        run: make run-clang-tidy
      - name: Build
        run: make build
      - name: Test
        run: make test

  build-release-artifacts:
    name: Build Release Artifacts
    needs: [check-recent-commits, build-test-lint]
    # Run on tags, manual dispatch, or scheduled builds (daily with commits, weekly unconditional).
    # For scheduled: skip daily (Mon-Sat) runs without recent commits, always run Sunday.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       (needs.check-recent-commits.outputs.has_recent_commits == 'true' ||
        github.event.schedule == '0 10 * * 0'))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write  # required for Google Workload Identity Federation
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds in the C++ SDK's conan image, which ships conan, gcc 13,
          # and a default profile with the viamconan remote already configured.
          - platform: linux/amd64
            runner: ubuntu-latest
            container: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:noble
            artifact_name: module-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-4cpu-arm
            container: ghcr.io/viamrobotics/cpp-sdk-conan-ubuntu:noble
            artifact_name: module-linux-arm64
          # macOS native build
          - platform: darwin/arm64
            runner: macos-26
            artifact_name: module-darwin-arm64

    # Container is only populated for Linux builds
    container: ${{ matrix.container }}

    steps:
      - name: Install Conan (macOS)
        if: runner.os == 'macOS'
        run: brew install conan

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/785265540/locations/global/workloadIdentityPools/static-file-id/providers/static-file-github

      - uses: google-github-actions/setup-gcloud@v2

      - name: Get firmware
        run: make get-firmware

      - name: Set up Conan
        run: ./bin/setup.sh

      - name: Build module
        run: ./bin/build.sh

      # Attach module.tar.gz to workflow run
      - name: Attach build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: module.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to Viam Module Registry
    needs: [build-release-artifacts]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            artifact_name: module-linux-amd64
          - platform: linux/arm64
            artifact_name: module-linux-arm64
          - platform: darwin/arm64
            artifact_name: module-darwin-arm64

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}

      - name: Extract meta.json from module archive
        run: tar -xzf module.tar.gz meta.json README.md

      - name: Upload module to Viam
        uses: viamrobotics/upload-module@v1
        with:
          module-path: module.tar.gz
          platform: ${{ matrix.platform }}
          version: ${{ github.ref_name }}
          key-id: ${{ secrets.VIAM_DEV_API_KEY_ID }}
          key-value: ${{ secrets.VIAM_DEV_API_KEY }}
          do-update: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
          do-upload: ${{ github.event_name == 'release' }}
